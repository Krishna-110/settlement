spring.application.name=debt-settlement
server.forward-headers-strategy=framework

# Database Connection - PostgreSQL.
# Production (Render) supplies these as environment variables; the values after the ':' are only
# the local-development defaults and expect a local Postgres on the standard port.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/settlement}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
# Query logging off by default - formatting and printing every statement is a real cost on a
# small host. Set SPRING_JPA_SHOW_SQL=true as an env var when you need to debug queries.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_SHOW_SQL:false}


# --- Spring Security & OAuth2 Configuration ---
# You will get these keys from the Google Cloud Console later
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=profile, email

# --- JWT Configuration ---
# This is a 256-bit secret key used to digitally sign our VIP wristbands.
jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS10aGF0LWlzLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmchIQ==}
jwt.expiration=86400000
# Expiration is in milliseconds (86400000 ms = 1 full day)

# --- Networking Configuration ---
# Required for Railway to handle HTTPS correctly
server.forward-headers-strategy=framework

app.frontend.redirect-uri=${FRONTEND_REDIRECT_URI:cleardues://--/login-success}

# Vonage SMS Configuration
vonage.api.key=${VONAGE_API_KEY:dummy}
vonage.api.secret=${VONAGE_API_SECRET:dummy}
vonage.brand.name=${VONAGE_BRAND_NAME:Settlement}
vonage.app.link=${VONAGE_APP_LINK:https://gaurav-tekkie.github.io/Settlement.github.io/}
