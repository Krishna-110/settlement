# Test-only configuration.
#
# The test suite runs against an in-memory H2 database (in PostgreSQL compatibility mode, so it
# behaves like production) instead of connecting to a real local database. Previously the Spring
# context test silently connected to whatever database happened to be running on the developer's
# machine, which made the suite fail on any machine that didn't have one set up the same way.
spring.datasource.url=jdbc:h2:mem:settlement_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dummy values so the Spring context can start without real secrets.
# (This file fully replaces the main application.properties on the test classpath, so every
# property the app requires at startup has to be present here too.)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=profile, email
jwt.secret=dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtYXQtbGVhc3QtMzItYnl0ZXMtbG9uZyEh
jwt.expiration=86400000

app.frontend.redirect-uri=cleardues://--/login-success

# Vonage is never actually called in tests - the client stays uninitialised with these dummies.
vonage.api.key=dummy
vonage.api.secret=dummy
vonage.brand.name=Settlement
vonage.app.link=https://example.test/
